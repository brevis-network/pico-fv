name = "pico-fv"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PicoFV32"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0-rc1"

[[require]]
name = "LeanZKCircuit_Plonky3"
git = "https://github.com/NethermindEth/LeanZKCircuit-Plonky3.git"
rev = "Dom/v4.28.0-rc1"

[[require]]
name = "LeanRV"
git = "https://github.com/NethermindEth/sail-riscv-lean"
rev = "v4.28.0-rc1"

[[lean_lib]]
name = "PicoFV"

[[lean_lib]]
name = "PicoFV32"

[[lean_lib]]
name = "PicoFV64"
