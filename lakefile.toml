name = "pico-fv"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PicoFV"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0-rc1"

[[require]]
name = "LeanZKCircuit"
git = "https://github.com/NethermindEth/leanzkcircuit.git"
rev = "v4.28.0-rc1"

[[require]]
name = "LeanRV"
git = "https://github.com/NethermindEth/sail-riscv-lean"
rev = "v4.28.0-rc1"

[[lean_lib]]
name = "PicoFV"
