# Replay every built PicoFV declaration into Lean's kernel with leanchecker, to catch a
# declaration a metaprogram added without the kernel check. It repeats the proofs' kernel work,
# so it runs weekly and on demand, not on pull requests.

name: replay

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leanchecker:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: scripts/ci/install_elan.sh
      # Also clones the Lake packages, which the restore below needs in place.
      - name: Mathlib cache
        run: lake exe cache get
      # After Lake has cloned the packages (see ci.yml).
      - name: restore builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
            .lake/packages/LeanRV/.lake/build
            .lake/packages/Sail/.lake/build
            .lake/packages/LeanZKCircuit_Plonky3/.lake/build
          key: picofv-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            picofv-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: build
        run: lake build PicoFV64
      # One process per module keeps the memory of each replay bounded. Only the modules the
      # build imports are replayed: a file nothing imports has no build to replay. The kernel
      # cannot replay what native_decide / bv_decide computed, so the files that use them (the
      # tactic baseline) are skipped; SOUNDNESS.md lists them.
      # The step fails when the listing fails or is empty, or when fewer modules replay than were
      # listed: a green run means every listed module was replayed.
      - name: replay
        run: |
          set -o pipefail
          skip=$(awk '{ print $2 }' scripts/fv-check/tactic-baseline.txt)
          modules=$(python3 scripts/ci/imported_modules.py \
            | { grep -vxF -f <(printf '%s\n' "$skip") || true; } \
            | sed 's/\.lean$//; s#/#.#g') \
            || { echo "::error::listing the modules failed"; exit 1; }
          listed=$(printf '%s' "$modules" | grep -c . || true)
          echo "listed: $listed modules"
          if [ "$listed" -eq 0 ]; then
            echo "::error::no modules listed: nothing to replay"
            exit 1
          fi
          replayed_log=$(mktemp)
          status=0
          printf '%s\n' "$modules" \
            | xargs -P 2 -I{} sh -c 'lake env leanchecker "$1" && echo "$1" >> "$2"' _ {} "$replayed_log" \
            || status=$?
          replayed=$(grep -c . "$replayed_log" || true)
          echo "replayed: $replayed of $listed modules"
          if [ "$status" -ne 0 ] || [ "$replayed" -ne "$listed" ]; then
            echo "::error::$((listed - replayed)) of $listed modules did not replay"
            exit 1
          fi
